[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infynno-mcat-question-bank-generator"
version = "2.0.0"
description = "Autonomous Multi-Agent AI System for Psychometric AAMC MCAT Question Generation, Admin Review, and Bank Persistence"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "testsprite_tests",
]


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern python 3.11 idioms)
]
ignore = [
    "E501",  # line length handled by ruff format
    "UP042", # preserve (str, Enum) for pydantic serialization
    "W291",  # trailing whitespace in multiline prompts
    "W293",  # blank line whitespace in multiline SVG strings
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "live_e2e: End-to-end integration tests requiring a running backend and live LLM API credentials",
]
addopts = "-m 'not live_e2e'"
filterwarnings = [
    "ignore::UserWarning:pydantic.*",
]
