version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ucat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucat_db
      POSTGRES_USER: ucat_user
      POSTGRES_PASSWORD: ucat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucat_user -d ucat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
