version: "2"
type: frontend
tech_stack:
  - JavaScript (ES2024)
  - React 19.2
  - Vite 8.3
  - Lucide React
  - Vanilla CSS Design System
routes:
  - path: /
    file: src/App.jsx
    auth_required: false
    description: Primary single page application container hosting Generator, Batch Activity, AI Validated Questions, and Question Bank views
features:
  - name: Navigation and Theme Management
    description: Global navigation bar for switching between Generator, Batches, AI Validated, and Question Bank tabs, plus dark/light mode toggle
    files:
      - src/components/layout/Navbar.jsx
      - src/App.jsx
      - src/hooks/useTheme.js
    entry_route: /
    user_interactions:
      - Click theme toggle button to switch between dark and light modes
      - Click Generator tab in navbar
      - Click Batches tab in navbar
      - Click Validated tab in navbar
      - Click Question Bank tab in navbar
      - Click brand logo or Home button to reset to landing hero
    api_calls:
      - method: GET
        endpoint: /api/health
      - method: GET
        endpoint: /api/sections
    auth_required: false

  - name: Hero Landing and Quick Presets
    description: Landing hero screen with quick-start action presets, jump to question bank, or start guided generation wizard
    files:
      - src/components/wizard/HeroLanding.jsx
      - src/views/GeneratorWorkspaceView.jsx
    entry_route: /
    user_interactions:
      - Click 'Start Generating' button to launch wizard
      - Click quick preset cards
      - Click 'Browse Question Bank' button to jump to bank tab
    api_calls: []
    auth_required: false

  - name: Guided Question Generator Wizard
    description: Step-by-step form to configure section, subtopic, question type, difficulty, batch size, and AI image toggle before generating questions
    files:
      - src/components/wizard/GuidedWizard.jsx
      - src/hooks/useGeneratorForm.js
    entry_route: /
    user_interactions:
      - Select exam section
      - Select target subtopic or topic domain
      - Select question type and format
      - Set difficulty level
      - Select generation scope preset (Mini-Batch 5 Qs or Full Mock Section 50 Qs)
      - Toggle AI Diagram / Image Generation switch
      - Click 'Generate Questions' button to start pipeline
    api_calls:
      - method: GET
        endpoint: /api/sections
    auth_required: false

  - name: Generation Pipeline Streaming and Live Workspace
    description: Real-time agentic execution workspace showing active agents, iteration counts, SSE live logs, and question previews
    files:
      - src/views/GeneratorWorkspaceView.jsx
      - src/components/pipeline/AgentVisualizer.jsx
      - src/components/pipeline/MultiAgentPipelineVisualizer.jsx
      - src/components/staged/BatchProgressHeader.jsx
      - src/hooks/useQuestionGenerator.js
    entry_route: /
    user_interactions:
      - Watch active agent stages update in real time
      - Expand and view event stream logs
      - Click 'Cancel Generation' button to abort active stream
      - View completed batch summary and review audits
    api_calls:
      - method: POST
        endpoint: /api/generate
    auth_required: false

  - name: Staged Question Review, Editing, and Approval
    description: Interactive review of newly generated questions with options to view rationales, edit content, approve to bank, or discard
    files:
      - src/components/staged/StagedBatchGrid.jsx
      - src/components/staged/StagedBatchReview.jsx
      - src/components/question/QuestionCard.jsx
      - src/components/question/QuestionInlineEditor.jsx
      - src/components/question/ReviewAuditView.jsx
    entry_route: /
    user_interactions:
      - Expand question card to review stimulus, stem, choices, and rationales
      - Click 'Edit' button to modify question stem or answer choices
      - Click 'Approve' button to save individual question to bank
      - Click 'Discard' button to remove individual question
      - Click 'Approve All' button to save entire batch to bank
      - Click 'Discard All' button to clear unsaved batch
      - Click 'Audit Trail' button to view full critic reasoning and scoring rubric
    api_calls:
      - method: POST
        endpoint: /api/questions
      - method: POST
        endpoint: /api/questions/:id/approve
    auth_required: false

  - name: Question Bank Explorer and Management
    description: Comprehensive repository explorer with search, faceted filtering by section, difficulty, and status, pagination, and deletion
    files:
      - src/views/QuestionBankView.jsx
      - src/components/bank/QuestionBankFilters.jsx
      - src/components/bank/QuestionBankTable.jsx
      - src/hooks/useQuestionBank.js
    entry_route: /
    user_interactions:
      - Type search query into question search bar
      - Filter by section dropdown
      - Filter by difficulty level
      - Filter by status
      - Change page number and items per page
      - Click question item to view detailed preview modal
      - Click delete question icon and confirm deletion
    api_calls:
      - method: GET
        endpoint: /api/questions
      - method: DELETE
        endpoint: /api/questions/:id
      - method: GET
        endpoint: /api/stats
    auth_required: false

  - name: Question Export
    description: Export selected or all question bank questions in multiple formats including CSV, JSON, QTI XML, and Markdown/PDF
    files:
      - src/components/modals/ExportPrintModal.jsx
      - src/components/modals/ExportPaperPreview.jsx
      - src/views/QuestionBankView.jsx
    entry_route: /
    user_interactions:
      - Click 'Export' button on Question Bank toolbar
      - Choose export format
      - Select export scope
      - Click 'Download Export File' button to trigger file download
    api_calls:
      - method: GET
        endpoint: /api/questions/export
    auth_required: false

  - name: Batch Activity Monitoring
    description: Dashboard tracking all previous batch generation runs, completion statuses, question yield, and timestamp logs
    files:
      - src/views/BatchActivityView.jsx
      - src/components/batch/BatchCard.jsx
      - src/components/batch/BatchJobCard.jsx
      - src/components/batch/BatchFiltersBar.jsx
    entry_route: /
    user_interactions:
      - Click Batches tab to view list of batch generation runs
      - Click a batch card to open detailed modal showing all generated questions in that run
      - Filter batches by date or status
    api_calls:
      - method: GET
        endpoint: /api/batches
      - method: GET
        endpoint: /api/batches/:batch_id
    auth_required: false

  - name: AI Validated Questions View
    description: Dedicated view highlighting questions that met high AI confidence and rubric validation criteria
    files:
      - src/views/AiValidatedQuestionsView.jsx
      - src/components/validated/AiValidatedQuestionCard.jsx
      - src/components/validated/AiValidatedFiltersBar.jsx
    entry_route: /
    user_interactions:
      - View list of high-confidence validated questions
      - Inspect AI score breakdowns and rubric evaluations
      - Bulk approve or select questions for export
    api_calls:
      - method: GET
        endpoint: /api/validated
      - method: GET
        endpoint: /api/questions
    auth_required: false

known_limitations: []
