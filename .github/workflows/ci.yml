name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff>=0.9.0

      - name: Run Backend Linting (Ruff)
        run: ruff check backend/

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Linting (Oxlint)
        run: pnpm lint

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ucat_user
          POSTGRES_PASSWORD: ucat_password
          POSTGRES_DB: ucat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://ucat_user:ucat_password@localhost:5432/ucat_db
          DEFAULT_TEXT_MODEL: deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo
          DEFAULT_IMAGE_MODEL: black-forest-labs/FLUX-1-schnell
          COST_PER_MILLION_INPUT_TOKENS: 0.10
          COST_PER_MILLION_OUTPUT_TOKENS: 0.32
          PASSING_SCORE_THRESHOLD: 90
        run: |
          PYTHONPATH=backend pytest backend/tests/test_backend.py backend/tests/test_database_structure.py -v --tb=short

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vite Production Build
        run: pnpm build
