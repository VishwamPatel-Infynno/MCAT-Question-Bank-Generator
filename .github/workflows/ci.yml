name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ucat_user
          POSTGRES_PASSWORD: ucat_password
          POSTGRES_DB: ucat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://ucat_user:ucat_password@localhost:5432/ucat_db
          DEFAULT_TEXT_MODEL: deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo
          DEFAULT_IMAGE_MODEL: black-forest-labs/FLUX-1-schnell
          COST_PER_MILLION_INPUT_TOKENS: 0.10
          COST_PER_MILLION_OUTPUT_TOKENS: 0.32
          PASSING_SCORE_THRESHOLD: 90
        run: |
          PYTHONPATH=backend pytest backend/tests/test_backend.py -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Vite Production Build
        working-directory: frontend
        run: npm run build
